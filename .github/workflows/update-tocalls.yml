name: update-tocalls
# 公式 aprs-deviceid の更新を毎週チェックし、差分があれば tocalls.json を更新する PR を自動で作る。
on:
  schedule:
    - cron: '0 0 * * 1'   # 毎週月曜 09:00 (JST)
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate tocalls.json
        run: |
          pip install pyyaml
          curl -sSfL -o /tmp/tocalls.yaml https://raw.githubusercontent.com/aprsorg/aprs-deviceid/refs/heads/main/tocalls.yaml
          python3 scripts/update-tocalls.py /tmp/tocalls.yaml
      - name: Open PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/web/tocalls.json; then echo "no change"; exit 0; fi
          branch="auto/update-tocalls-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/web/tocalls.json
          git commit -m "デバイス ID (tocall) 情報を最新の aprs-deviceid に更新 (自動)"
          git push -f origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "デバイス ID (tocall) 情報の自動更新" \
            --body "公式 aprs-deviceid の更新を取り込みました (自動作成)。マージする前に、更新履歴 (src/version.go) へ 1 行足すかどうか確認してください。"
